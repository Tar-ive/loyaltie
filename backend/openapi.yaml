openapi: 3.0.0
info:
  title: Clay Pit AI API
  description: Persona-aware customer service API for Clay Pit restaurant. This API provides endpoints for managing conversation sessions and interacting with an AI-powered customer service agent.
  version: 1.0.0
  contact:
    name: Clay Pit Support
    email: support@claypit.com
  license:
    name: ISC

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.claypit.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Sessions
    description: Session management endpoints
  - name: Messages
    description: Message and conversation endpoints

paths:
  /:
    get:
      tags:
        - Health
      summary: Root endpoint
      description: Returns basic API information
      operationId: root
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Clay Pit AI API is running
                  version:
                    type: string
                    example: 1.0.0

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is healthy and responding
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /api/v1/sessions/:
    post:
      tags:
        - Sessions
      summary: Create a new session
      description: Creates a new conversation session for a customer
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            example:
              customer_id: aniket_001
              customer_name: Aniket Sharma
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                metadata:
                  sessionId: sess_1761446015649_qxznm6y0i
                  customerId: aniket_001
                  customerName: Aniket Sharma
                  createdAt: 2025-10-26T02:33:35.649Z
                  lastAccessedAt: 2025-10-26T02:33:35.654Z
                  status: active
                  conversationTurns: 0
                  ordersPlaced: 0
                state:
                  conversationHistory: []
                  orderState:
                    phase: chatting
                  contextVariables: {}
                  profileUpdates: {}
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/customer/{customer_id}:
    get:
      tags:
        - Sessions
      summary: List sessions for a customer
      description: Get all active sessions for a specific customer
      operationId: listSessions
      parameters:
        - name: customer_id
          in: path
          required: true
          description: The customer ID
          schema:
            type: string
          example: aniket_001
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionMetadata'
              example:
                sessions:
                  - sessionId: sess_1761446015649_qxznm6y0i
                    customerId: aniket_001
                    customerName: Aniket Sharma
                    createdAt: 2025-10-26T02:33:35.649Z
                    lastAccessedAt: 2025-10-26T02:33:35.654Z
                    status: active
                    conversationTurns: 3
                    ordersPlaced: 0
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/{session_id}:
    get:
      tags:
        - Sessions
      summary: Get session details
      description: Retrieve full details for a specific session
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session ID
          schema:
            type: string
          example: sess_1761446015649_qxznm6y0i
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Session sess_xxx not found

    delete:
      tags:
        - Sessions
      summary: Delete a session
      description: Permanently delete a session and all its data
      operationId: deleteSession
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session ID
          schema:
            type: string
          example: sess_1761446015649_qxznm6y0i
      responses:
        '200':
          description: Session deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  session_id:
                    type: string
                    example: sess_1761446015649_qxznm6y0i
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/messages/session/{session_id}:
    post:
      tags:
        - Messages
      summary: Send a message to the agent
      description: Send a message to the AI agent and get a response. The agent will respond based on the customer's profile and conversation history.
      operationId: sendMessage
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session ID
          schema:
            type: string
          example: sess_1761446015649_qxznm6y0i
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              message: I need lunch for 8 people tomorrow
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                session_id: sess_1761446015649_qxznm6y0i
                response: Perfect! I can help you with lunch for 8 people tomorrow. Let me get some details to create the perfect spread for your team.
                order_state:
                  phase: chatting
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/messages/session/{session_id}/conversation:
    get:
      tags:
        - Messages
      summary: Get conversation history
      description: Retrieve the full conversation history for a session
      operationId: getConversation
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session ID
          schema:
            type: string
          example: sess_1761446015649_qxznm6y0i
      responses:
        '200':
          description: Conversation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  conversation:
                    type: array
                    items:
                      type: object
                  order_state:
                    type: object
              example:
                session_id: sess_1761446015649_qxznm6y0i
                conversation: []
                order_state:
                  phase: chatting
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/messages/session/{session_id}/logs:
    get:
      tags:
        - Messages
      summary: Get session logs
      description: Retrieve all logs for a session
      operationId: getSessionLogs
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session ID
          schema:
            type: string
          example: sess_1761446015649_qxznm6y0i
      responses:
        '200':
          description: Session logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
              example:
                logs:
                  - timestamp: 2025-10-26T02:33:35.649Z
                    sessionId: sess_1761446015649_qxznm6y0i
                    level: info
                    category: session_start
                    message: Session started
        '404':
          description: Session not found
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    SessionCreateRequest:
      type: object
      required:
        - customer_id
        - customer_name
      properties:
        customer_id:
          type: string
          description: Unique identifier for the customer
          example: aniket_001
        customer_name:
          type: string
          description: Full name of the customer
          example: Aniket Sharma

    SessionMetadata:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique session identifier
          example: sess_1761446015649_qxznm6y0i
        customerId:
          type: string
          description: Customer ID
          example: aniket_001
        customerName:
          type: string
          description: Customer name
          example: Aniket Sharma
        createdAt:
          type: string
          format: date-time
          description: When the session was created
          example: 2025-10-26T02:33:35.649Z
        lastAccessedAt:
          type: string
          format: date-time
          description: When the session was last accessed
          example: 2025-10-26T02:33:35.654Z
        status:
          type: string
          enum: [active, completed, abandoned]
          description: Session status
          example: active
        conversationTurns:
          type: integer
          description: Number of conversation turns
          example: 0
        ordersPlaced:
          type: integer
          description: Number of orders placed in this session
          example: 0

    SessionState:
      type: object
      properties:
        conversationHistory:
          type: array
          description: Full conversation history
          items:
            type: object
        orderState:
          type: object
          properties:
            phase:
              type: string
              enum: [chatting, confirming, processing, completed]
              example: chatting
            draft:
              type: object
              nullable: true
            orderId:
              type: string
              nullable: true
        contextVariables:
          type: object
          description: Additional context variables
        profileUpdates:
          type: object
          description: Profile updates from this session

    Session:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/SessionMetadata'
        state:
          $ref: '#/components/schemas/SessionState'

    MessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The message to send to the agent
          example: I need lunch for 8 people tomorrow

    MessageResponse:
      type: object
      properties:
        session_id:
          type: string
          description: The session ID
          example: sess_1761446015649_qxznm6y0i
        response:
          type: string
          description: The agent's response
          example: Perfect! I can help you with lunch for 8 people tomorrow.
        order_state:
          type: object
          nullable: true
          description: Current order state, if applicable
          properties:
            phase:
              type: string
              enum: [chatting, confirming, processing, completed]
            draft:
              type: object
              nullable: true
            orderId:
              type: string
              nullable: true

    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: Session not found

  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: An error occurred processing your request
